# Minimal Compose smoke for the hardened image. Pin by digest in GitOps.
# Listeners are :1514 (testdata/container/config.yaml). cap_drop ALL; never
# add NET_BIND_SERVICE (C17 / ADR 0010). Bind-mounted secrets must be
# readable by UID 65532 (0o644). `make test-container` mints
# testdata/container/token (≥32 bytes) and runs this file with
# `docker compose up --build`.
services:
  labsyslog:
    image: ghcr.io/hilather/labsyslog:local
    build:
      context: ..
    command:
      - serve
      - --config=/etc/labsyslog/config.yaml
      - --management-listen=:8088
    ports:
      - "127.0.0.1:1514:1514/udp"
      - "127.0.0.1:1514:1514/tcp"
      - "127.0.0.1:18088:8088"
    volumes:
      - ../testdata/container/config.yaml:/etc/labsyslog/config.yaml:ro
      - ../testdata/container/token:/run/secrets/labsyslog-token:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/labsyslog", "healthcheck", "--url=http://127.0.0.1:8088/v1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
