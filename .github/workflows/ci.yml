# LabSyslog continuous integration (FND-001).
#
# Default PR CI must stay green. This workflow runs implemented targets:
# format, lint, unit, race, fuzz-smoke, documentation, changelog,
# generated, config-compat, parity, security-scan, container-test.
#
# Makefile placeholders still fail closed locally (web-test, web-build).
# generate, verify-generated, and test-config-compat joined in CFG-001.
# test-fuzz-smoke joined in WIRE-001. test-parity joined in MCP-001.
# test-container and security-scan joined in DEP-001.
# Makefile placeholders still fail closed locally (test-parity,
# test-container, security-scan).
# generate, verify-generated, and test-config-compat joined in CFG-001.
# test-fuzz-smoke joined in WIRE-001.
# web-test and web-build joined in UI-001.
# Do not mark a failing check optional.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.7"
  GOTOOLCHAIN: local
  GOPROXY: https://proxy.golang.org,direct

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Format
        run: make format
      - name: Tree must stay clean
        run: git diff --exit-code

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Lint
        run: make lint

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Unit tests
        run: make test | tee unit.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: unit-logs
          path: unit.log
          retention-days: 14

  race:
    name: race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Race tests
        run: make test-race | tee race.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: race-logs
          path: race.log
          retention-days: 14

  documentation:
    name: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Documentation checks
        run: make test-docs

  changelog:
    name: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Changelog entry
        run: make test-changelog

  generated:
    name: generated
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Verify generated JSON Schema
        run: make verify-generated

  config-compat:
    name: config-compat
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Config fixture suite
        run: make test-config-compat

  fuzz-smoke:
    name: fuzz-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fuzz smoke
        run: make test-fuzz-smoke

  parity:
    name: parity
  security-scan:
    name: security-scan
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: REST/MCP parity
        run: make test-parity
      - name: Security scan
        run: make security-scan

  container-test:
    name: container-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Container contract
        run: make test-container
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Committed embed is a real Vite tree
        run: |
          set -euo pipefail
          # Inspect the checkout *before* web-build. The scratch image
          # embeds this tree (no Node stage). Asserting after web-build
          # would only prove CI can produce a dist, not that git contains one.
          test -f internal/web/dist/index.html
          grep -E -q '<title>LabSyslog</title>|<div id="root">' internal/web/dist/index.html
          ! grep -q 'UI assets were not copied' internal/web/dist/index.html
          ls internal/web/dist/assets/*.js >/dev/null
      - name: Operator SPA source still builds
        run: |
          make web-install
          make web-test
          make web-build
          make verify-web-dist
